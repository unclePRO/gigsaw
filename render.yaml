services:
  - type: web
    name: gigsaw-ai
    runtime: python
    region: oregon
    plan: free
    rootDir: ai
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn gigsaw_ai.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GIGSAW_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: '["gemini-3.5-flash-lite", "gemini-flash-lite-latest", "gemini-3.1-flash-lite"]'
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: gigsaw
      - key: MONGODB_SCHEMA_MODE
        value: backend_mongoose
      - key: MANAGE_MONGO_INDEXES
        value: "false"
      - key: BACKEND_USERS_COLLECTION
        value: users
      - key: BACKEND_PROJECTS_COLLECTION
        value: projects
      - key: BACKEND_SERVICE_CATALOG_COLLECTION
        value: ai_service_catalog
      - key: CHROMA_PERSIST_DIRECTORY
        value: ./storage/chroma
      - key: CHROMA_COLLECTION
        value: freelancer_portfolios
      - key: CORS_ORIGINS
        value: "*"
